# Terminology Database Schema Definition
# 此檔案定義了專案術語庫 (terminology.json) 的絕對結構。
# 所有自動化腳本或人工編輯都必須遵守此結構，嚴禁寫入未定義之屬性。

# 核心檔案位置: .agent/lexicon-core/databases/terminology.json

type: object
description: >
  術語庫。以 PascalCase 術語 ID 為鍵的物件，非陣列。ID 是穩定識別碼，
  更名等同退役加新增；比對用的主鍵是項目內的 zh。
patternProperties:
  "^[A-Z][A-Za-z0-9]*$":
    type: object
    required:
      - zh
      - en
      - description
      - forbidden
      - level
    properties:
      zh:
        type: string
        description: "中文主術語。錨定注入與領域偵測的比對主鍵。"
      en:
        type: array
        items:
          type: string
        description: "對應的英文術語陣列（第一個為主譯名）。長度大於 3 的別名以 \\b 設字界。"
      description:
        type: string
        description: "該術語在專案上下文中的具體定義與語境。"
      forbidden:
        type: array
        items:
          type: string
        description: "嚴禁在此專案中使用的近似詞或區域方言（如：智能體、程序員）。"
      level:
        type: integer
        enum: [1, 2, 3]
        description: >
          管線行為權重。1 觸發領域分類並優先取為標籤；2 只執行雙語錨定；
          3 為 IGNORE_LIST，不錨定、不進標籤候選。行為語意的 SSOT 是
          GUIDE.md §3.2；本檔只約束結構與可用值，不重述行為，兩處各寫一份
          會漂移成互相矛盾的兩種定義。

# 術語庫維護規約 (Content Governance)
# ---------------------------------------------------------------------------------
# NLP 代理在執行「知識萃取」或「手動補完」時，必須遵循以下技術準則：

maintenance_rules:
  format:
    - "雙語對齊：description 描述中若提及術語，必須使用『中文（English）』格式。"
    - "解析度優先：定義必須具備學術解析度，嚴禁使用曖昧不明的口語描述。"
  de-projectification:
    - "強制脫敏：術語定義中必須移除所有專案專屬路徑、Commit ID 與日期。"
    - "通用化限制：定義應描述『技術本質』，使其可遷移至其他專案使用。"
  admission:
    - "字界審查：中文主鍵無正字法字界，短鍵會命中更長詞的內部（量化 落在「輕量化」）。收錄前必須檢視語料中的實際命中位置，不得只檢視定義。"
  forbidden_criteria:
    - "區域方言：嚴禁使用非專業之區域慣用語（如：程序員 -> 工程師）。"
    - "語意坍縮：嚴禁使用容易產生岐義的簡稱。"
# ---------------------------------------------------------------------------------
